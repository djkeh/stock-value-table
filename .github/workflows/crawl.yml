name: Crawl Stocks and Deploy

on:
  schedule:
    # 4:30 PM KST on weekdays (Monday to Friday)
    # KST is UTC+9, so 16:30 KST - 9 hours = 07:30 UTC
    - cron: '30 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Crawler
        id: crawl
        run: |
          set +e
          python crawler.py
          EXIT_CODE=$?
          set -e
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          if [ "$EXIT_CODE" -ne 0 ] && [ "$EXIT_CODE" -ne 2 ]; then
            exit "$EXIT_CODE"
          fi

      - name: Prepare Build Directory
        run: |
          mkdir -p build/data
          cp index.html index.css app.js target-gicodes.csv .gitignore build/
          cp data/stocks.json data/meta.json build/data/

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build
          branch: gh-pages
          clean: true

      - name: Fail Workflow on Partial Crawl Failure
        if: steps.crawl.outputs.exit_code == '2'
        run: |
          echo "::error::일부 종목 크롤링에 실패했습니다. 캐시로 복구해 배포했으나 확인이 필요합니다. Job Summary를 확인하세요."
          exit 1
