name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-mock pytest-cov

      - name: Run Python Crawler Tests with Coverage
        run: |
          pytest --cov=crawler test_crawler.py --cov-report=json --cov-report=term:skip-covered

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Node.js dependencies
        run: |
          npm ci || npm install

      - name: Run Frontend Tests with Coverage
        run: |
          npm run test:coverage

      - name: Generate Coverage Report to Step Summary
        run: |
          echo "### 📊 테스트 커버리지 요약 (Test Coverage Summary)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 대상 컴포넌트 | 테스트 커버리지 (Coverage) |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          python -c "import json; d=json.load(open('coverage.json')); print(f'| **Backend Crawler** (crawler.py) | {d[\"totals\"][\"percent_covered_display\"]}% |')" >> $GITHUB_STEP_SUMMARY
          node -e "const fs=require('fs'); const s=JSON.parse(fs.readFileSync('coverage/coverage-summary.json','utf8')); console.log('| **Frontend UI** (app.js) | ' + s.total.lines.pct + '% |');" >> $GITHUB_STEP_SUMMARY

      - name: Checkout gh-pages (for stocks.json)
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: gh-pages-temp
        continue-on-error: true

      - name: Prepare Build Directory
        run: |
          mkdir -p build/data
          cp index.html index.css app.js target-gicodes.csv .gitignore build/
          
          # Copy stocks.json from the gh-pages checkout if it exists, otherwise fall back to repo's data/stocks.json
          if [ -d gh-pages-temp ] && [ -f gh-pages-temp/data/stocks.json ]; then
            cp gh-pages-temp/data/stocks.json build/data/
            echo "Successfully restored stocks.json from gh-pages branch."
          else
            cp data/stocks.json build/data/
            echo "Warning: stocks.json not found on gh-pages, using fallback from repository."
          fi
          rm -rf gh-pages-temp

      - name: Recalculate derived metrics in stocks.json
        run: |
          python recalculate.py build/data/stocks.json

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build
          branch: gh-pages
          clean: true
