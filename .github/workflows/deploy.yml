name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Checkout gh-pages (for stocks.json)
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: gh-pages-temp
        continue-on-error: true

      - name: Prepare Build Directory
        run: |
          mkdir -p build/data
          cp index.html index.css app.js target-gicodes.csv build/
          
          # Copy stocks.json from the gh-pages checkout if it exists, otherwise fall back to repo's data/stocks.json
          if [ -d gh-pages-temp ] && [ -f gh-pages-temp/data/stocks.json ]; then
            cp gh-pages-temp/data/stocks.json build/data/
            echo "Successfully restored stocks.json from gh-pages branch."
          else
            cp data/stocks.json build/data/
            echo "Warning: stocks.json not found on gh-pages, using fallback from repository."
          fi
          rm -rf gh-pages-temp

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build
          branch: gh-pages
          clean: true
