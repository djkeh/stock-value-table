<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>상장주식 재무정보 대시보드</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="index.css">
  
  <!-- Anti-FOUC (Flash of Unstyled Content) Theme Selector Script -->
  <meta name="color-scheme" content="light dark">
  <script>
    {
      const systemThemeEnabled = localStorage.getItem("system-theme-enabled") !== "false";
      let theme = "light";
      if (systemThemeEnabled) {
        const hour = new Date().getHours();
        const isNight = hour >= 20 || hour < 7;
        theme = isNight ? "dark" : "light";
      } else {
        theme = localStorage.getItem("manual-theme") || "light";
      }
      document.documentElement.setAttribute("data-theme", theme);
    }
  </script>
</head>
<body>
  <div class="app-container">
    <header>
      <div class="brand">
        <h1>상장주식 재무정보 대시보드</h1>
        <p class="subtitle">FnGuide 크롤링 기반 주요 시세 및 4개년 컨센서스 재무 지표</p>
      </div>
      
      <!-- Theme Control Controls -->
      <div class="theme-controls">
        <input type="checkbox" id="system-theme-checkbox" class="hidden-checkbox">
        <label class="system-theme-label" for="system-theme-checkbox">
          <!-- Clock Icon for Auto/System -->
          <svg class="auto-icon" viewBox="0 0 24 24">
            <path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/>
          </svg>
          <span class="label-text">System</span>
        </label>
        
        <!-- Theme Switch Button -->
        <div class="theme-switch" id="theme-toggle" role="button" aria-label="화면 테마 토글" tabindex="0">
          <!-- Sun icon (Light) -->
          <svg viewBox="0 0 24 24">
            <path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.02.39 1.41 0s.39-1.03 0-1.41l-1.06-1.06zm1.06-12.37c-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06c.39-.38.39-1.02 0-1.41zm-12.37 12.37c-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06c.39-.38.39-1.02 0-1.41z"/>
          </svg>
          <div class="toggle-dot"></div>
          <!-- Moon icon (Dark) -->
          <svg viewBox="0 0 24 24">
            <path d="M12.3 22h-.1c-5.5 0-10-4.5-10-10 0-4.7 3.3-8.8 8-9.8.7-.2 1.3.3 1.3 1 0 .4-.2.8-.6.9-3.7 1.3-6.2 4.9-6.2 8.9 0 4.4 3.6 8 8 8 4 0 7.6-2.5 8.9-6.2.2-.4.6-.6.9-.6.7 0 1.2.6 1 1.3-.9 4.7-5 8-9.9 8z"/>
          </svg>
        </div>
      </div>
    </header>

    <!-- Tables Container (Will be filled dynamically by app.js) -->
    <main class="tables-container" id="tables-container">
      <div id="loading-message" style="text-align: center; color: var(--text-secondary); padding: 3rem; background: var(--container-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--container-border); border-radius: 1rem;">
        데이터를 로딩 중입니다...
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
